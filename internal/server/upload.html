<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magpie</title>
<style>
  :root { --bg: #ffffff; --surface: #f6f8fa; --ink: #1f2328; --muted: #59636e; --line: #d1d9e0; --accent: #0969da; --bad: #cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --surface: #151b23; --ink: #e6edf3; --muted: #9198a1; --line: #30363d; --accent: #4493f8; --bad: #f85149; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 16px; }
  main { width: 100%; max-width: 560px; text-align: center; }
  h1 { font-size: 28px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .tag { color: var(--muted); margin: 0 0 28px; }
  #drop { display: block; border: 1px dashed var(--muted); border-radius: 6px; background: var(--surface);
    padding: 64px 24px; cursor: pointer; }
  #drop.over { border-color: var(--accent); border-style: solid; }
  #drop strong { display: block; font-size: 17px; }
  #drop span { color: var(--muted); font-size: 13px; }
  input[type=file] { display: none; }
  #status { min-height: 52px; margin-top: 18px; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px auto 0; max-width: 320px; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .error { color: var(--bad); }
  .notes { margin-top: 28px; color: var(--muted); font-size: 12.5px; }
  .notes p { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <h1>Magpie</h1>
  <p class="tag">Security scan for iOS apps</p>

  <label id="drop" for="file">
    <strong>Drop an .ipa here</strong>
    <span>or click to choose a file. A zipped .app works too.</span>
  </label>
  <input id="file" type="file" accept=".ipa,.zip">

  <div id="status" role="status" aria-live="polite"></div>

  <div class="notes">
    <p>Runs entirely on this computer. The app is deleted as soon as the scan finishes.</p>
    <p>App Store downloads are encrypted, so use an Xcode archive or export for a full scan.</p>
  </div>
</main>
<script>
  var drop = document.getElementById('drop');
  var input = document.getElementById('file');
  var status = document.getElementById('status');

  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer.files.length) upload(e.dataTransfer.files[0]);
  });
  input.addEventListener('change', function () {
    if (input.files.length) upload(input.files[0]);
  });
  // Dropping a file outside the box shouldn't navigate away from the page.
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); });

  function show(html) { status.innerHTML = html; }
  function escape(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function upload(file) {
    if (!/\.(ipa|zip)$/i.test(file.name)) {
      show('<p class="error">' + escape(file.name) + ' is not an .ipa or .zip file. To scan an .app folder, zip it first.</p>');
      return;
    }
    var mb = (file.size / 1048576).toFixed(1);
    show('<p>Uploading <b>' + escape(file.name) + '</b> (' + mb + ' MB)</p><div class="bar"><div id="p"></div></div>');
    var form = new FormData();
    form.append('file', file);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/scan');
    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable) document.getElementById('p').style.width = (e.loaded / e.total * 100) + '%';
    };
    xhr.upload.onload = function () { show('<p>Scanning <b>' + escape(file.name) + '</b>…</p>'); };
    xhr.onload = function () {
      if (xhr.status !== 200) {
        show('<p class="error">' + escape(xhr.responseText.trim() || 'Scan failed') + '</p>');
        return;
      }
      document.open();
      document.write(xhr.responseText);
      document.close();
      history.pushState(null, '', '/');
    };
    xhr.onerror = function () { show('<p class="error">Lost connection to Magpie. Is <code>magpie serve</code> still running?</p>'); };
    xhr.send(form);
  }
  window.addEventListener('popstate', function () { location.reload(); });
</script>
</body>
</html>
